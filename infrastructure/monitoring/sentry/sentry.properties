# Sentry Configuration
# EduBridge OS Observability Foundation

# Sentry DSN (replace with actual DSN)
SENTRY_DSN=https://your-dsn@sentry.io/project-id

# Environment
SENTRY_ENVIRONMENT=local

# Release tracking
SENTRY_RELEASE=edubridge@1.0.0

# Sample rate (1.0 = 100% of transactions)
SENTRY_TRACES_SAMPLE_RATE=1.0

# Error sample rate
SENTRY_SAMPLE_RATE=1.0

# Enable performance monitoring
SENTRY_ENABLE_TRACING=true

# Send default PII
SENTRY_SEND_DEFAULT_PII=true

# Max breadcrumbs
SENTRY_MAX_BREADCRUMBS=100

# Attach stack traces
SENTRY_ATTACH_STACKTRACE=true

# Before send hook (filter sensitive data)
SENTRY_BEFORE_SEND=filter_sensitive_data
