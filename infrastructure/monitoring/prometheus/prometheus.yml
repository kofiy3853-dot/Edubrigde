# Prometheus Configuration
# EduBridge OS Observability Foundation

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert rules
rule_files:
  - "alerts/*.yml"

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape targets
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'local'

  # Spring Boot API
  - job_name: 'edubridge-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:4000']
        labels:
          service: 'edubridge-api'
          environment: 'local'
    scrape_interval: 10s

  # Next.js Platform
  - job_name: 'edubridge-platform'
    static_configs:
      - targets: ['platform:3000']
        labels:
          service: 'edubridge-platform'
          environment: 'local'

  # PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          environment: 'local'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          environment: 'local'

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'
          environment: 'local'

  # MinIO
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
          environment: 'local'

  # NGINX
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          environment: 'local'

  # OpenTelemetry Collector
  - job_name: 'opentelemetry'
    static_configs:
      - targets: ['opentelemetry-collector:8888']
        labels:
          service: 'opentelemetry'
          environment: 'local'
