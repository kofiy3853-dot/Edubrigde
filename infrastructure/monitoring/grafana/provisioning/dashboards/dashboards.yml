# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'EduBridge OS'
    orgId: 1
    folder: 'EduBridge'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
