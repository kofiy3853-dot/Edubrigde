# Grafana Datasource Provisioning

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'

  - name: Sentry
    type: sentry
    access: proxy
    url: https://sentry.io
    editable: true
    jsonData:
      organization: edubridge
