# Grafana Configuration
# EduBridge OS Observability Foundation

app_mode: production

server:
  protocol: http
  http_port: 3001
  domain: localhost

database:
  type: sqlite3
  path: /var/lib/grafana/grafana.db

users:
  allow_sign_up: false
  allow_org_create: false

security:
  admin_user: admin
  admin_password: admin

auth:
  disable_login_form: false

log:
  mode: console
  level: info

metrics:
  enabled: true
  interval_seconds: 10

alerting:
  enabled: true

unified_alerting:
  enabled: true
