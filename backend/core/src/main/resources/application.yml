server:
  port: 4000

spring:
  application:
    name: edubridge-os
  profiles:
    active: development
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/edubridge
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    locations: classpath:db/migration,filesystem:../database/migrations
    schemas:
      - public
      - identity
      - academic
      - career
      - financial
      - institution
      - communication
      - analytics
      - ai
      - shared
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "edubridge:"
      use-key-prefix: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: 5000
        linger.ms: 10
        batch.size: 16384
    consumer:
      group-id: edubridge
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.edubridge.shared.events,com.edubridge.*"
    listener:
      ack-mode: manual_immediate
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1
  buckets:
    student-documents: edubridge-student-documents
    student-certificates: edubridge-student-certificates
    learning-resources: edubridge-learning-resources
    application-documents: edubridge-application-documents
    reports: edubridge-reports
    temporary-uploads: edubridge-temporary-uploads
    media-assets: edubridge-media-assets
    generated-files: edubridge-generated-files
  defaults:
    expiry-duration: 15m
    max-file-size: 50MB
    allowed-types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/gif
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    versioning-enabled: true
    encryption-enabled: true
