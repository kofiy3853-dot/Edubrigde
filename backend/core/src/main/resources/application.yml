server:
  port: 4000
  servlet:
    context-path: /api

spring:
  application:
    name: edubridge-core
  profiles:
    active: development
  datasource:
    url: jdbc:postgresql://localhost:5432/edubridge
    username: edubridge
    password: edubridge
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: localhost
    port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: edubridge-core
      auto-offset-reset: earliest
  cache:
    type: redis
    redis:
      time-to-live: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.edubridge: DEBUG
    org.springframework.security: DEBUG
